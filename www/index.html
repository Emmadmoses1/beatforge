<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BeatForge</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2b3035;color:#dfe3e6;font:13px system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:#3a4147;border-bottom:2px solid #1d2125}
.b{padding:9px 11px;background:#4b545b;border:1px solid #1d2125;border-radius:4px;color:#e6e9ec;font-weight:700;font-size:12px}
.b.on{background:#ff7a1a;color:#111}
#lcd,#bpm{background:#14181b;color:#ff9a3c;font:700 17px monospace;padding:5px 8px;border:0;border-radius:4px;width:62px;text-align:center}
#ps{background:#14181b;color:#ff9a3c;border:0;border-radius:4px;padding:8px;font-weight:700}
#meter{width:44px;height:10px;background:#14181b;border-radius:2px;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4caf50,#ff9a3c,#e53935)}
#main{flex:1;min-height:0;overflow:auto;background:#262b2f}
#tabs{display:flex;background:#3a4147;border-top:2px solid #1d2125}
#tabs button{flex:1;padding:12px 0;background:none;border:0;color:#aab2b8;font-weight:700;font-size:12px}
#tabs button.on{color:#ff9a3c;box-shadow:inset 0 3px #ff9a3c}
.ch{padding:6px;border-bottom:1px solid #1d2125}.ch.sel{background:#303940}
.h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.led{width:16px;height:16px;border-radius:50%;border:2px solid #111;background:#333;padding:0}.led.on{background:#7dff4a}
.nm{flex:1;text-align:left;background:#4b545b;border:1px solid #1d2125;border-radius:4px;color:#fff;padding:8px;font-weight:700}
.h input{width:90px;accent-color:#ff7a1a}
.st{display:flex;gap:3px}
.s{flex:1;height:34px;background:#555d64;border-radius:3px}.s.g1{background:#6c767d}.s.on{background:#ff4b2b}
.cur{outline:2px solid #fff;outline-offset:-2px}
.row{display:flex;gap:6px;padding:6px;align-items:center;flex-wrap:wrap}
.roll{width:max-content}.rr{display:flex;height:26px}
.kl{position:sticky;left:0;z-index:2;width:38px;flex:none;background:#e8eaec;color:#222;font-size:10px;border-bottom:1px solid #999;padding:6px 2px}
.bk .kl{background:#2a2a2a;color:#eee}
.cell{width:34px;flex:none;border-bottom:1px solid #1d2125;border-right:1px solid #333;background:#323a40}
.bk .cell{background:#2b3238}.cell:nth-child(4n+1){border-right:1px solid #667}
.cell.on{background:#ff7a1a}.cell.hd{box-shadow:inset 3px 0 #fff}
.pl{display:flex;align-items:center;gap:3px;margin:3px 6px;width:max-content}
.tn{width:56px;font-size:11px;color:#9aa}
.pc{width:40px;height:40px;background:#3a4147;border-radius:4px;text-align:center;line-height:40px;font-weight:700;color:#111}
.f{background:#ff7a1a}.f1{background:#4fc3f7}.f2{background:#9ccc65}.f3{background:#ba68c8}.f4{background:#ffd54f}.f5{background:#f06292}
.mx{display:flex;gap:6px;padding:8px;width:max-content}
.strip{width:68px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#333b41;padding:8px 4px;border-radius:6px;font-size:11px}
.fader{writing-mode:vertical-lr;direction:rtl;-webkit-appearance:slider-vertical;width:34px;height:150px;accent-color:#ff7a1a}
.pan{width:60px;accent-color:#4fc3f7}
h4{margin:14px 8px 4px;color:#ff9a3c}
.bi{margin:4px 8px;padding:13px;background:#3a4147;border-radius:6px;font-weight:700}
.msg{padding:20px;color:#9aa}
</style><link rel="stylesheet" href="fl.css"></head><body><div id="app">
<div id="top">
<button class="b" id="play">▶</button><button class="b" id="stop">■</button><button class="b" id="mode">PAT</button>
<div id="lcd">1:1</div><input id="bpm" type="number" value="120" min="60" max="220">
<select id="ps"></select><div id="meter"><i></i></div></div>
<div id="main"></div>
<div id="tabs"><button data-v="rack">Rack</button><button data-v="piano">Piano</button><button data-v="list">Playlist</button><button data-v="mix">Mixer</button><button data-v="brow">Browser</button></div>
</div><script>
const $=s=>document.querySelector(s),main=$('#main');
const el=(t,c,x,f)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null&&x!=='')e.textContent=x;if(f)e.onclick=f;return e};
const ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
const master=ctx.createGain();master.gain.value=.8;
const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
const an=ctx.createAnalyser();an.fftSize=256;comp.connect(an);const ad=new Uint8Array(256);
(function mt(){an.getByteTimeDomainData(ad);let p=0;for(const v of ad)p=Math.max(p,Math.abs(v-128));$('#meter i').style.width=Math.min(100,p/128*130)+'%';requestAnimationFrame(mt)})();
['pointerdown','touchstart'].forEach(e=>addEventListener(e,()=>{if(ctx.state!=='running')ctx.resume()},{passive:true}));
const nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
{const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
const mtof=m=>440*Math.pow(2,(m-69)/12);
let cur=master;
function env(g,t,a,pk,d){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function rel(g,tc,t){g.gain.cancelAndHoldAtTime?g.gain.cancelAndHoldAtTime(t):g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(0,t,tc)}
function noise(t,dur,type,fr,q,v){const s=ctx.createBufferSource();s.buffer=nbuf;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=fr;f.Q.value=q;const g=ctx.createGain();env(g,t,.001,v,dur);s.connect(f);f.connect(g);g.connect(cur);s.start(t);s.stop(t+dur+.05)}
function tone(ty,f0,f1,t,dur,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+Math.min(.12,dur));env(g,t,.002,v,dur);o.connect(g);g.connect(cur);o.start(t);o.stop(t+dur+.05)}
const DR={Kick:t=>{tone('sine',160,42,t,.5,1);noise(t,.02,'highpass',3000,1,.3)},
Snare:t=>{noise(t,.18,'highpass',1800,.7,.7);tone('triangle',220,160,t,.12,.5)},
'Hi-hat':t=>noise(t,.05,'highpass',8000,.7,.35),
'Open Hat':t=>noise(t,.35,'highpass',7000,.7,.3),
Clap:t=>{[0,.012,.024].forEach(d=>noise(t+d,.05,'bandpass',1500,1.2,.6));noise(t+.03,.2,'bandpass',1400,1.2,.5)},
Tom:t=>tone('sine',220,90,t,.4,.9),
Rim:t=>{tone('square',900,700,t,.04,.25);noise(t,.03,'bandpass',2500,2,.3)},
Shaker:t=>noise(t,.09,'bandpass',6000,1,.3)};
function playNote(k,m,t){const f=mtof(m);
 if(k==='log'){const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
  o.type='sine';o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.06);
  lp.type='lowpass';lp.frequency.value=1200;env(g,t,.003,1,.55);o.connect(lp);lp.connect(g);g.connect(cur);o.start(t);o.stop(t+.7);
  noise(t,.03,'bandpass',900,2,.25);return{rel(){}}}
 if(k==='grand'){const g=ctx.createGain();g.connect(cur);const dec=Math.max(1.2,4-m/30);
  [[1,1],[2,.5],[3,.28],[4,.18],[5,.1]].forEach(([h,a])=>{const o=ctx.createOscillator(),pg=ctx.createGain();
   o.type='sine';o.frequency.value=f*h*(1+h*h*.00012);env(pg,t,.003,a*.5,dec/h*1.3);o.connect(pg);pg.connect(g);o.start(t);o.stop(t+dec+1)});
  noise(t,.02,'lowpass',2500,.5,.12);return{rel(tt){rel(g,.15,tt)}}}
 const g=ctx.createGain(),lp=ctx.createBiquadFilter(),os=[];lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.7;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.22,t+.5);
 [-9,0,9].forEach(d=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;o.connect(lp);o.start(t);os.push(o)});
 lp.connect(g);g.connect(cur);return{rel(tt){rel(g,.35,tt);os.forEach(o=>o.stop(tt+2.5))}}}

/* ---- project ---- */
let chs=[],pats=[{}],PL=Array.from({length:6},()=>Array(16).fill(-1)),sel=0,pat=0,view='rack',bpm=120,song=false,nl=1,uid=1;
function mk(o){const n=ctx.createGain(),p=ctx.createStereoPanner();n.connect(p);p.connect(master);
 const c=Object.assign({id:uid++,vol:.8,pan:0,mute:false},o);uid=Math.max(uid,c.id+1);n.gain.value=c.vol;p.pan.value=c.pan;c.n=n;c.p=p;chs.push(c);return c}
const nt=c=>pats[pat][c.id]||(pats[pat][c.id]=[]);
function save(){try{localStorage.setItem('bf2',JSON.stringify({bpm,pats,PL,chs:chs.map(({id,name,kind,key,vol,pan,mute})=>({id,name,kind,key,vol,pan,mute}))}))}catch(e){}}
let L=null;try{L=JSON.parse(localStorage.getItem('bf2'))}catch(e){}
if(L&&L.chs&&L.chs.length){bpm=L.bpm;pats=L.pats;PL=L.PL;L.chs.forEach(mk)}
else[['Kick','drum','Kick'],['Snare','drum','Snare'],['Hi-hat','drum','Hi-hat'],['Clap','drum','Clap'],['Warm Pad','syn','pad'],['Grand Piano','syn','grand'],['Log Drum','syn','log']].forEach(([name,kind,key])=>mk({name,kind,key}));
sel=chs[0].id;$('#bpm').value=bpm;
const sd=()=>60/bpm/4;

/* ---- engine ---- */
function trig(c,n,t){if(c.mute)return;cur=c.n;
 if(c.kind==='drum')DR[c.key](t);
 else if(c.kind==='smp'){if(c.buf){const s=ctx.createBufferSource();s.buffer=c.buf;s.connect(c.n);s.start(t)}}
 else playNote(c.key,n.m,t).rel(t+n.l*sd())}
let playing=false,pos=0,nextT=0,tm;
const songLen=()=>{let m=1;PL.forEach(r=>r.forEach((p,i)=>{if(p>=0)m=Math.max(m,i+1)}));return m};
function barPats(b){if(!song)return[pat];const r=[];PL.forEach(tr=>{const p=tr[b];if(p>=0&&!r.includes(p))r.push(p)});return r}
function head(p){document.querySelectorAll('.cur').forEach(x=>x.classList.remove('cur'));
 const b=Math.floor(p/16);document.querySelectorAll('[data-c="'+(p%16)+'"]').forEach(x=>x.classList.add('cur'));
 if(song)document.querySelectorAll('[data-b="'+b+'"]').forEach(x=>x.classList.add('cur'));
 $('#lcd').textContent=(b+1)+':'+(((p%16)>>2)+1)}
function sched(){while(nextT<ctx.currentTime+.12){const st=pos%16,bar=Math.floor(pos/16);
 barPats(bar).forEach(pi=>chs.forEach(c=>(pats[pi][c.id]||[]).forEach(n=>{if(n.s===st)trig(c,n,nextT)})));
 const p=pos;setTimeout(()=>{if(playing)head(p)},Math.max(0,(nextT-ctx.currentTime)*1000));
 nextT+=sd();pos++;if(pos>=(song?songLen():1)*16)pos=0}}
function stop(){clearInterval(tm);playing=false;pos=0;$('#play').classList.remove('on');document.querySelectorAll('.cur').forEach(x=>x.classList.remove('cur'));$('#lcd').textContent='1:1'}
$('#play').onclick=()=>{ctx.resume();if(playing)return stop();playing=true;pos=0;nextT=ctx.currentTime+.05;tm=setInterval(sched,25);$('#play').classList.add('on')};
$('#stop').onclick=stop;
$('#mode').onclick=()=>{song=!song;$('#mode').textContent=song?'SONG':'PAT';$('#mode').classList.toggle('on',song);stop()};
$('#bpm').onchange=e=>{bpm=Math.min(220,Math.max(60,+e.target.value||120));e.target.value=bpm;save()};
$('#ps').onchange=e=>{if(e.target.value==='n'){pats.push({});pat=pats.length-1}else pat=+e.target.value;render()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){view=v;render();if(v==='piano')main.scrollTop=12*26}

/* ---- panels ---- */
function rRack(m){chs.forEach(c=>{const row=el('div','ch'+(c.id===sel?' sel':'')),h=el('div','h');
 const v=document.createElement('input');v.type='range';v.min=0;v.max=100;v.value=c.vol*100;v.oninput=()=>{c.vol=v.value/100;c.n.gain.value=c.vol};
 h.append(el('button','led'+(c.mute?'':' on'),'',()=>{c.mute=!c.mute;render()}),el('button','nm',c.name,()=>{sel=c.id;render()}),v);
 if(c.kind==='syn')h.append(el('button','b','Piano',()=>{sel=c.id;go('piano')}));
 const st=el('div','st');
 for(let s=0;s<16;s++){const u=el('div','s g'+((s>>2)&1)+(nt(c).some(n=>n.s===s)?' on':''));u.dataset.c=s;
  u.onpointerdown=e=>{e.preventDefault();const a=nt(c);
   if(a.some(n=>n.s===s))pats[pat][c.id]=a.filter(n=>n.s!==s);else{a.push({s,m:60,l:1});trig(c,{m:60,l:1},ctx.currentTime)}
   u.classList.toggle('on',nt(c).some(n=>n.s===s));save()};st.append(u)}
 row.append(h,st);m.append(row)})}
function rPiano(m){const c=chs.find(x=>x.id===sel);
 if(!c||c.kind!=='syn'){m.append(el('div','msg','Pick a synth channel in the Rack and tap "Piano".'));return}
 const bar=el('div','row');bar.append(el('b',null,c.name));
 [1,2,4].forEach(l=>bar.append(el('button','b'+(nl===l?' on':''),'Snap '+l,()=>{nl=l;render()})));m.append(bar);
 const g=el('div','roll'),a=nt(c);
 for(let k=84;k>=48;k--){const r=el('div','rr'+([1,3,6,8,10].includes(k%12)?' bk':'')),kl=el('div','kl',k%12===0?'C'+(k/12-1):'');
  kl.onpointerdown=()=>{cur=c.n;playNote(c.key,k,ctx.currentTime).rel(ctx.currentTime+.5)};r.append(kl);
  for(let s=0;s<16;s++){const n=a.find(n=>n.m===k&&s>=n.s&&s<n.s+n.l);
   const u=el('div','cell'+(n?' on':'')+(n&&n.s===s?' hd':''));u.dataset.c=s;
   u.onpointerdown=()=>{const y=main.scrollTop;
    if(n)pats[pat][c.id]=a.filter(x=>x!==n);else{a.push({s,m:k,l:Math.min(nl,16-s)});cur=c.n;playNote(c.key,k,ctx.currentTime).rel(ctx.currentTime+.4)}
    render()};r.append(u)}
  g.append(r)}m.append(g)}
function rList(m){const bar=el('div','row');bar.append(el('b',null,'Paint:'));
 pats.forEach((_,i)=>bar.append(el('button','b'+(i===pat?' on':''),'P'+(i+1),()=>{pat=i;render()})));m.append(bar);
 const hd=el('div','pl');hd.append(el('div','tn',''));for(let b=0;b<16;b++){const u=el('div','tn',b+1);u.style.width='40px';u.style.textAlign='center';hd.append(u)}m.append(hd);
 PL.forEach((tr,t)=>{const r=el('div','pl');r.append(el('div','tn','Track '+(t+1)));
  tr.forEach((p,b)=>{const u=el('div','pc'+(p>=0?' f f'+(p%6):''),p>=0?'P'+(p+1):'');u.dataset.b=b;
   u.onpointerdown=()=>{tr[b]=tr[b]===pat?-1:pat;render()};r.append(u)});m.append(r)});
 m.append(el('div','msg','Tap a cell to place the selected pattern. Turn on SONG at the top and press Play.'))}
function rMix(m){const w=el('div','mx');
 [...chs,{name:'Master',master:1}].forEach(c=>{const s=el('div','strip');s.append(el('b',null,c.name));
  const f=document.createElement('input');f.type='range';f.className='fader';f.min=0;f.max=100;f.value=(c.master?master.gain.value:c.vol)*100;
  f.oninput=()=>{if(c.master)master.gain.value=f.value/100;else{c.vol=f.value/100;c.n.gain.value=c.vol}};s.append(f);
  if(!c.master){const p=document.createElement('input');p.type='range';p.className='pan';p.min=-100;p.max=100;p.value=c.pan*100;
   p.oninput=()=>{c.pan=p.value/100;c.p.pan.value=c.pan};s.append(p,el('button','b'+(c.mute?'':' on'),'M',()=>{c.mute=!c.mute;render()}))}
  w.append(s)});m.append(w)}
const picker=document.createElement('input');picker.type='file';picker.accept='audio/*';picker.style.display='none';document.body.appendChild(picker);
let onPick=null;picker.onchange=async()=>{const f=picker.files[0];if(!f||!onPick)return;
 try{onPick(await ctx.decodeAudioData(await f.arrayBuffer()),f.name.replace(/\.[^.]+$/,''))}catch(e){alert('Could not read that audio file')}picker.value=''};
const dest=ctx.createMediaStreamDestination();comp.connect(dest);let rec,chunks=[],rc=0;
function rBrow(m){const add=(t,f)=>m.append(el('div','bi',t,f));
 m.append(el('h4',null,'Drums'));Object.keys(DR).forEach(k=>add('+ '+k,()=>{mk({name:k,kind:'drum',key:k});go('rack')}));
 m.append(el('h4',null,'Instruments'));
 [['Warm Pad','pad'],['Grand Piano','grand'],['Log Drum','log']].forEach(([n,k])=>add('+ '+n,()=>{mk({name:n,kind:'syn',key:k});go('rack')}));
 m.append(el('h4',null,'My sounds'));
 add('+ Import sample / loop',()=>{onPick=(b,n)=>{mk({name:n,kind:'smp',buf:b});go('rack')};picker.click()});
 add(rec&&rec.state==='recording'?'■ Stop recording':'● Record loop (captures everything you play)',()=>{ctx.resume();
  if(rec&&rec.state==='recording'){rec.stop();return}
  rec=new MediaRecorder(dest.stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{try{mk({name:'My loop '+(++rc),kind:'smp',buf:await ctx.decodeAudioData(await new Blob(chunks).arrayBuffer())});go('rack')}catch(e){alert('Could not save recording')}};
  rec.start();render()})}
function render(){const y=main.scrollTop;main.innerHTML='';({rack:rRack,piano:rPiano,list:rList,mix:rMix,brow:rBrow})[view](main);main.scrollTop=y;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 $('#ps').innerHTML=pats.map((_,i)=>'<option value="'+i+'"'+(i===pat?' selected':'')+'>Pattern '+(i+1)+'</option>').join('')+'<option value="n">+ New</option>';save()}
render();
</script><script src="fl.js"></script><script src="drums.js"></script></body></html>
